version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger_apm
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - METRICS_STORAGE_TYPE=prometheus
    ports:
      - "16686:16686" # Web UI Dashboard (Open this in your browser)
      - "4317:4317"   # OpenTelemetry gRPC Collector port (Python sends data here)
      - "4318:4318"   # OpenTelemetry HTTP Collector port
    restart: unless-stopped
  
