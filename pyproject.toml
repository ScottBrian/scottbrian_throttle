[project]
name = "scottbrian_throttle"
version = "1.0.0"
description = "Miscellaneous utilities"
readme = "README.rst"
requires-python = "~=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["utilities"]
authors = [{ name = "Scott Tuttle", email = "sbtuttle@outlook.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows :: Windows 11"]
dependencies = [
    "pydantic ~=2.13",
    "sentry-sdk ~=2.69",
    "scottbrian-locking ~=3.0",
    "scottbrian-utils ~=7.1",
    "wrapt ~=2.4",
]

[tool.setuptools]
packages = ["scottbrian_throttle"]
package-dir = { "" = "src" }

[tool.mypy]
mypy_path = "C:\\Users\\Tiger\\PycharmProjects\\scottbrian_throttle\\.venv314\\Lib\\site-packages"


[project.urls]
Documentation = "https://scottbrian-throttle.readthedocs.io/en/latest/"
Source = "https://github.com/ScottBrian/scottbrian_throttle.git"

[build-system]
requires = ["setuptools ~=83.0"]
build-backend = 'setuptools.build_meta'
