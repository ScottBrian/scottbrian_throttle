[project]
name = "scottbrian_throttle"
version = "1.0.0"
description = "Miscellaneous utilities"
readme = "README.rst"
requires-python = "~=3.14.0"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["utilities"]
authors = [{ name = "Scott Tuttle", email = "sbtuttle@outlook.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows :: Windows 11"]
dependencies = [
    "pydantic ~=2.13",
    "sentry-sdk ~=2.69",
    "scottbrian-locking ~=3.0",
    "scottbrian-utils ~=7.1",
    "wrapt ~=2.5",
    "tox>=4.64.4",
    "mypy>=2.3.1",
]

#[tool.setuptools]
#packages = ["scottbrian_throttle"]
#package-dir = { "" = "src" }

[tool.mypy]
mypy_path = "typings"
strict_optional = "True"
no_implicit_optional = "True"
disallow_untyped_calls = "True"
warn_unused_configs = "True"
strict = "True"
implicit_reexport = "True"
show_error_codes = "True"

[tool.ruff]
# 1. Global max line length for CODE (used by ruff format and ruff check)
line-length = 88

[tool.ruff.lint]
# Enable the E501 (line-too-long) and W505 (doc-line-too-long) rules
select = ["E501", "W505"]
extend-select = ["ALL"]
ignore = ["D203", "D213", "T201", "COM812"]

[tool.ruff.lint.pycodestyle]
# 2. Max line length for DOCSTRINGS and STANDALONE COMMENTS
max-doc-length = 72

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Ignore ruff errors in test_throttle.py
"tests/**/*.py" = ["S101", "PLC0415",
    "SLF001", "D102",
    "SIM300", "G004", "PLR0913"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

[project.urls]
Documentation = "https://scottbrian-throttle.readthedocs.io/en/latest/"
Source = "https://github.com/ScottBrian/scottbrian_throttle.git"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "check-manifest>=0.51",
    "more-itertools>=11.2.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "safety>=3.8.1",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.10",
    "sphinx-rtd-theme>=3.1.0",
    "sybil>=10.1.0",
    "tox>=4.64.1",
    "tox-uv>=1.36.0",
]

[tool.pytest.ini_options]
addopts = "-rsxX -l --tb=short --strict-markers --strict-config --capture=tee-sys -p no:doctest"
xfail_strict = true
log_cli = 1
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s %(msecs)03d [%(levelname)8s] %(name)s %(funcName)s: %(lineno)d (Thread ID: %(thread)d) (Name: %(threadName)s) -> %(message)s"
log_cli_date_format = "%H:%M:%S"
testpaths = [
    "tests",
]

[tool.check-manifest]
ignore = [
    ".idea/**/*",
    ".safety-project.ini",
    ".venv314/**/*"
]

[build-system]
requires = ["hatchling"]
build-backend = 'hatchling.build'


[tool.hatch.build.targets.sdist]
# Hatchling automatically includes everything in Git.
# We explicitly exclude developer/CI configurations from the final PyPI package.
exclude = [
    "uv.lock",
    ".coveragerc",
    ".github/", # GitHub actions

]

[tool.hatch.build.targets.wheel]
packages = ["src/scottbrian_throttle"]
