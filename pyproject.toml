[project]
name = "scottbrian_throttle"
version = "1.0.0"
description = "Miscellaneous utilities"
readme = "README.rst"
requires-python = "~=3.14.0"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["utilities"]
authors = [{ name = "Scott Tuttle", email = "sbtuttle@outlook.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows :: Windows 11"]
dependencies = [
    "pydantic ~=2.13",
    "sentry-sdk ~=2.69",
    "scottbrian-locking ~=3.0",
    "scottbrian-utils ~=7.1",
    "wrapt ~=2.5",
    "tox>=4.64.4",
    "mypy>=2.3.1",
]

#[tool.setuptools]
#packages = ["scottbrian_throttle"]
#package-dir = { "" = "src" }

[tool.mypy]
mypy_path = "typings"
strict_optional = "True"
no_implicit_optional = "True"
disallow_untyped_calls = "True"
warn_unused_configs = "True"
strict = "True"
implicit_reexport = "True"
show_error_codes = "True"

[tool.mypy.pytest]
ignore_missing_imports = "True"

[tool.ruff]
# 1. Global max line length for CODE (used by ruff format and ruff check)
line-length = 88

[tool.ruff.lint]
# Enable the E501 (line-too-long) and W505 (doc-line-too-long) rules
select = ["E501", "W505"]
extend-select = ["ALL"]
ignore = ["T201", ]

[tool.ruff.lint.pycodestyle]
# 2. Max line length for DOCSTRINGS and STANDALONE COMMENTS
max-doc-length = 72


[tool.ruff.lint.per-file-ignores]
# Ignore ruff errors in test_throttle.py
"tests/**/*.py" = ["S101", "PLC0415", "SLF001", "D102", "SIM300", "G004"]


[project.urls]
Documentation = "https://scottbrian-throttle.readthedocs.io/en/latest/"
Source = "https://github.com/ScottBrian/scottbrian_throttle.git"

#[build-system]
#requires = ["setuptools ~=83.0"]
#build-backend = 'setuptools.build_meta'

[build-system]
requires = ["hatchling"]
build-backend = 'hatchling.build'

[dependency-groups]
dev = [
    "tox>=4.64.1",
    "tox-uv>=1.36.0",
]

# Ensure your py.typed marker and Mypy plugin are included in the build
[tool.hatch.build.targets.wheel]
packages = ["src/scottbrian_throttle"]
